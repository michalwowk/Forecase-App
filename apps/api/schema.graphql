type Query {
	health: Health!
	"""
	Places matching `query`, in Open-Meteo order (no filter, no sort). The user picks one.
	"""
	placeSearch(
		"Name typed by the user. Prefix match; optional `, <country or region>` qualifier."
		query: String!
	): [Place!]!
	"""
	Next 7 days for a place from `placeSearch`, scored per activity. Unknown id → null.
	"""
	forecast(placeId: ID!): Forecast
}

type Health {
	status: String!
}

type Place {
	"GeoNames id."
	id: ID!
	name: String!
	"First-level region, e.g. Tyrol."
	region: String
	country: String
}

type Forecast {
	place: Place!
	"One row per activity: skiing, surfing, outdoor, indoor."
	activities: [ActivityForecast!]!
}

"Local calendar date of the place, YYYY-MM-DD."
scalar Date

type ActivityForecast {
	activity: Activity!
	"false → data temporarily unavailable; `days` is empty and `bestDay` null."
	available: Boolean!
	"Skiing only: height in metres the forecast is for (mountains nearby)."
	dataElevation: Int
	"Highest score of the week, earliest on a tie. null if no day reaches Fair."
	bestDay: Date
	"7 local days, starting tomorrow."
	days: [DayForecast!]!
}

type DayForecast {
	date: Date!
	state: DayState!
	"0–100. null unless state is SCORED."
	score: Int
	"null unless state is SCORED."
	label: Label
	"1–3 English reasons."
	reasons: [String!]!
	"Raw values behind the score."
	keyValues: [KeyValue!]!
}

type KeyValue {
	label: String!
	value: Float!
	unit: String!
}

enum Activity {
	SKIING
	SURFING
	OUTDOOR
	INDOOR
}

enum DayState {
	SCORED
	"The activity can't happen here (no sea, no mountains)."
	NOT_APPLICABLE
	"Too many forecast hours missing to judge the day."
	NO_DATA
	"Dangerous weather — stay home."
	UNSAFE
}

enum Label {
	POOR
	FAIR
	GOOD
	GREAT
}
